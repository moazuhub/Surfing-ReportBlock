
name: Validate Rule Lists

on:
  push:
    paths:
      - 'SystemReport.list'
      - 'Analytics.list'
      - 'AdSDK.list'
      - 'AppTelemetry.list'
      - '.github/workflows/validate.yml'
  pull_request:
    paths:
      - 'SystemReport.list'
      - 'Analytics.list'
      - 'AdSDK.list'
      - 'AppTelemetry.list'
      - '.github/workflows/validate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate rule files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import sys

          files = [
              "SystemReport.list",
              "Analytics.list",
              "AdSDK.list",
              "AppTelemetry.list",
          ]

          allowed = {"DOMAIN", "DOMAIN-SUFFIX"}
          blocked_suffixes = {
              "com", "net", "org", "edu", "gov",
              "cn", "uk", "jp", "io", "co.uk"
          }

          domain_pattern = re.compile(
              r"^(?=.{1,253}$)"
              r"(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.)+"
              r"[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$"
          )

          errors = []
          seen = {}

          for filename in files:
              path = Path(filename)

              if not path.is_file():
                  errors.append(f"{filename}: file missing")
                  continue

              source = ""
              purpose = ""

              for number, raw in enumerate(
                  path.read_text(encoding="utf-8").splitlines(), 1
              ):
                  line = raw.strip()

                  if not line:
                      continue

                  if line.startswith("#"):
                      comment = line[1:].strip()

                      if comment.lower().startswith("source:"):
                          source = comment[7:].strip()

                      elif comment.lower().startswith("purpose:"):
                          purpose = comment[8:].strip()

                      continue

                  parts = [item.strip() for item in line.split(",")]

                  if len(parts) != 2 or parts[0] not in allowed:
                      errors.append(
                          f"{filename}:{number}: unsupported rule: {line}"
                      )
                      continue

                  rule_type, domain = parts
                  domain = domain.lower().rstrip(".")

                  if not domain_pattern.fullmatch(domain):
                      errors.append(
                          f"{filename}:{number}: invalid domain: {domain}"
                      )
                      continue

                  if rule_type == "DOMAIN-SUFFIX" and domain in blocked_suffixes:
                      errors.append(
                          f"{filename}:{number}: overly broad suffix: {domain}"
                      )

                  if not source.startswith("https://"):
                      errors.append(
                          f"{filename}:{number}: missing HTTPS source comment"
                      )

                  if len(purpose) < 8:
                      errors.append(
                          f"{filename}:{number}: missing purpose explanation"
                      )

                  key = (rule_type, domain)

                  if key in seen:
                      errors.append(
                          f"{filename}:{number}: duplicate rule, "
                          f"also in {seen[key]}"
                      )
                  else:
                      seen[key] = filename

                  source = ""
                  purpose = ""

          if errors:
              print("\n".join(errors))
              sys.exit(1)

          print("All rule files passed enhanced validation.")
          print(f"Validated {len(seen)} rules.")
          PY
